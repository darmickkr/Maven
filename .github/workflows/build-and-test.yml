name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: kingforbe/mavenproject:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 1: Install core-library into the runner's local storage
    - name: Build Core Library
      run: mvn clean install -f core-library/pom.xml

    # Step 2: Now build your warproject safely
    - name: Build War Project
      run: mvn clean install -f warproject/pom.xml

    # Step 3: Log in to Docker Hub (Always log in BEFORE pushing)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build and Push Docker Image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_NAME }} ./warproject
        docker push ${{ env.DOCKER_IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: server ssh
      uses: appleboy/ssh-action@v1  # <-- FIXED: removed the 's' from ssh-actions
      with: 
        host: ${{ vars.HOST_IP }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_KEY }}
        port: 22
        script: | 
          docker stop maven-app || true
          docker rm maven-app || true
          docker pull ${{ env.DOCKER_IMAGE_NAME }} || true
          docker run -d --name maven-app --dns 8.8.8.8 -p 80:8080 ${{ env.DOCKER_IMAGE_NAME }}
