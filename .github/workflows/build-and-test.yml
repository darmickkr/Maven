name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: kingforbe/mavenproject:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 1: Install core-library into the runner's local storage
    - name: Build Core Library
      run: mvn clean install -f core-library/pom.xml

    # Step 2: Now build your warproject safely
    - name: Build War Project
      run: mvn clean install -f warproject/pom.xml

    # Step 3: Log in to Docker Hub (Always log in BEFORE pushing)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build and Push Docker Image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_NAME }} ./warproject
        docker push ${{ env.DOCKER_IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Pull image onto runner
      run: docker pull ${{ env.DOCKER_IMAGE_NAME }}

    - name: Save Docker image to archive
      run: docker save ${{ env.DOCKER_IMAGE_NAME }} -o image.tar

    # Native Linux SCP and SSH transfer
    - name: Copy and Deploy via Native Linux Commands
      run: |
        # 1. Write the EC2 private key securely onto the runner disk
        echo "${{ secrets.AWS_EC2_KEY }}" > private_key.pem
        chmod 600 private_key.pem

        # 2. Direct transfer via native Linux SCP
        echo "🚀 Transferring image.tar to EC2..."
        scp -o StrictHostKeyChecking=no -i private_key.pem image.tar ubuntu@${{ vars.HOST_IP }}:/home/ubuntu/image.tar

        # 3. Direct execution via native Linux SSH
        echo "⚡ Executing remote deployment script on EC2..."
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ vars.HOST_IP }} << 'EOF'
          # Clean up old containers
          sudo docker stop maven-app || true
          sudo docker rm maven-app || true
          
          # Load image from local disk
          sudo docker load -i /home/ubuntu/image.tar
          
          # Delete file to clear disk space
          rm -f /home/ubuntu/image.tar
          
          # Start the new application container
          sudo docker run -d --name maven-app -p 80:8080 ${{ env.DOCKER_IMAGE_NAME }}
        EOF

        # 4. Clean up key file from the GitHub runner
        rm -f private_key.pem

