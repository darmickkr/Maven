name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: kingforbe/mavenproject:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Step 1: Install core-library into the runner's local storage
    - name: Build Core Library
      run: mvn clean install -f core-library/pom.xml

    # Step 2: Now build your warproject safely
    - name: Build War Project
      run: mvn clean install -f warproject/pom.xml

    # Step 3: Log in to Docker Hub (Always log in BEFORE pushing)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Build and Push Docker Image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_NAME }} ./warproject
        docker push ${{ env.DOCKER_IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 1: Log in to Docker Hub on the runner machine
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 2: Download the image onto the GitHub runner machine
    - name: Pull image onto runner
      run: docker pull ${{ env.DOCKER_IMAGE_NAME }}

    # Step 3: Package the Docker image into a compressed tar file
    - name: Save Docker image to archive
      run: docker save ${{ env.DOCKER_IMAGE_NAME }} -o image.tar

    # Step 4: Transfer the image file directly to your EC2 server over SSH
    - name: Transfer image to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ vars.HOST_IP }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_KEY }}
        port: 22
        source: "image.tar"
        target: "/home/ubuntu/"

    # Step 5: Log into EC2, load the local file, and start your container
    - name: Deploy container locally on server
      uses: appleboy/ssh-action@v1
      with: 
        host: ${{ vars.HOST_IP }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_KEY }}
        port: 22
        script: | 
          # Stop and remove any older application instances
          docker stop maven-app || true
          docker rm maven-app || true
          
          # Load the image from the file transferred to the local disk
          docker load -i /home/ubuntu/image.tar
          
          # Delete the file to save disk space on your server
          rm -f /home/ubuntu/image.tar
          
          # Run your web application
          docker run -d --name maven-app -p 80:8080 ${{ env.DOCKER_IMAGE_NAME }}
